name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Install deps
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check app tests && uv run ruff format --check app tests
      - name: Tests (SQLite, no services needed)
        run: uv run pytest -q
      - name: Dependency vulnerabilities
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --ignore-vuln PYSEC-2025-183  # PyJWT: disputed, no fix released

  backend-migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tilthwave
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-postgres-pw
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_DB: tilthwave
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-postgres-pw
      API_SECRET_KEY: ci-only-k7Zq2vXm9pL4nR8tW1yB6cD3fG5hJ0aE2sU4iO7rT9wQ1eY3
      STREAMER_BROKER_HOSTS: '["localhost:9092"]'
      STREAMER_SENSORS_TOPIC: ci.sensors
      STREAMER_WATER_CONTROL_TOPIC: ci.water-control
      FLOW_RUNNER_MINUTES: "1"
      PYTHONPATH: app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Migrations apply, backfill real rows, match the models, and roll back
        env:
          PSQL: postgresql://postgres:ci-only-postgres-pw@localhost:5432/tilthwave
        run: |
          # Populate the tables at the last revision before the data-carrying ones, so every
          # backfill (sensor.farm_name from the link tables, created_date NOT NULL) and every
          # downgrade runs on real rows, not on empty tables where a wrong JOIN would pass.
          uv run alembic upgrade a1c2e3f4b5d6
          psql "$PSQL" -v ON_ERROR_STOP=1 -c \
            "insert into farm (farm_name, address, size) values ('CI Farm', 'x', 1);
             insert into zone (farm_name, zone_name, size, soil_type) values ('CI Farm', 'CI Zone', 1, 'x');
             insert into sensor (serial_number, type, is_active) values ('CI001', 'moisture_sensor', true);
             insert into zone_sensors (zone_name, sensor_serial_number) values ('CI Zone', 'CI001');
             insert into sensor_records (sensor_serial_number, data) values ('CI001', '{\"type\": \"moisture\", \"value\": 1}');
             insert into irrigation_task (zone_name, status) values ('CI Zone', 'completed');"
          uv run alembic upgrade head
          uv run alembic check
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc "select count(*) from sensor where farm_name is null" | grep -qx 0
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc "select count(*) from sensor_records where created_date is null or updated_date is null" | grep -qx 0
          uv run alembic downgrade base
          uv run alembic upgrade head
          # the downgrade snapshot restored nothing (tables were recreated empty) and is gone again
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc "select to_regclass('sensor_farm_name_snapshot') is null" | grep -qx t

  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/simulator
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Lockfile is up to date
        run: uv lock --check
      - name: Install deps
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uv run ruff check app && uv run ruff format --check app
      - name: Dependency vulnerabilities
        run: uv export --frozen --no-dev --format requirements-txt > /tmp/requirements.txt && uvx pip-audit -r /tmp/requirements.txt --no-deps --ignore-vuln PYSEC-2025-183  # PyJWT: disputed, no fix released

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev   # dev-only tooling (vitest 2) tracked by Dependabot

  images:
    runs-on: ubuntu-latest
    needs: [backend, simulator]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Backend image builds
        run: docker build -f apps/backend/docker/Dockerfile apps/backend
      - name: Simulator image builds
        run: docker build -f apps/simulator/docker/Dockerfile apps/simulator
