name: Release images

# A version tag is a production release (deploy/README.md, "Releases"): build the three images
# once, on the tagged commit, and publish them to ghcr.io. Nothing is published on ordinary
# pushes; the local stack keeps building from the checkout (TILTHWAVE_TAG=local).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: apps/backend
            dockerfile: apps/backend/docker/Dockerfile
          - name: simulator
            context: apps/simulator
            dockerfile: apps/simulator/docker/Dockerfile
          - name: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The web bundle bakes the public API URL in at build time (apps/web/Dockerfile), so a
      # release image is only right for the deployment whose URL it was built with.
      - name: The web image needs NEXT_PUBLIC_API_BASE_URL
        if: matrix.name == 'web' && vars.NEXT_PUBLIC_API_BASE_URL == ''
        run: |
          echo "::error::Set the repository variable NEXT_PUBLIC_API_BASE_URL to the API's public URL:"
          echo "::error::  gh variable set NEXT_PUBLIC_API_BASE_URL --body https://api.example.com"
          exit 1

      # Image names must be lowercase; the repository owner is not.
      - name: Image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/tilthwave-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> tags v1.2.3, 1.2.3 and sha-<commit>; the OCI labels point back at this commit.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.name == 'web' && format('NEXT_PUBLIC_API_BASE_URL={0}', vars.NEXT_PUBLIC_API_BASE_URL) || '' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Point the Coolify application at this release and redeploy. Skipped until the repository
  # variables COOLIFY_URL and COOLIFY_APP_UUID and the secret COOLIFY_TOKEN exist
  # (deploy/README.md, "Coolify"). The compose file Coolify runs reads TILTHWAVE_TAG.
  deploy:
    needs: images
    if: vars.COOLIFY_URL != '' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Set TILTHWAVE_TAG on the Coolify application
        run: |
          auth=(-H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Content-Type: application/json" -H "Accept: application/json")
          body="{\"key\":\"TILTHWAVE_TAG\",\"value\":\"${TAG}\"}"
          # PATCH updates an existing variable; the first release has to create it.
          curl -fsS -X PATCH "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs" "${auth[@]}" -d "$body" \
            || curl -fsS -X POST "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/envs" "${auth[@]}" -d "$body"
      - name: Deploy
        run: |
          curl -fsS -X POST "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" -H "Accept: application/json"
