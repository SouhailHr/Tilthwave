# https://taskfile.dev

version: '3'

vars:
  DC: $(which docker-compose)

tasks:

  build:
    desc: "build services"
    cmds:
      - sh -c "{{.DC}} build {{.CLI_ARGS}}"
    silent: true

  ps:
    desc: "Show services state"
    cmds:
      - sh -c "{{.DC}} ps {{.CLI_ARGS}}"
    silent: true

  up:
    desc: "Up services"
    cmds:
      - sh -c "{{.DC}} up {{.CLI_ARGS}}"
    silent: true

  unsure:
    desc: "Make sure that a service is up"
    cmds:
      - sh -c "{{.DC}} up -d {{.CLI_ARGS}}"
    silent: true

  stop:
    desc: "Stop services"
    cmds:
      - sh -c "{{.DC}} stop {{.CLI_ARGS}}"
    silent: true


  logs:
    desc: "Watch services logs"
    cmds:
      - sh -c "{{.DC}} logs {{.CLI_ARGS}}"
    silent: true

  exec:
    desc: "Exec a command in services"
    cmds:
      - sh -c "{{.DC}} exec {{.CLI_ARGS}}"
    silent: true



  run_cli:
    desc: "Run CLI"
    cmds:
      - docker exec -it sensors-guard-mocker bash
