[project]
name = "tilthwave-backend"
version = "0.1.0"
description = "Tilthwave backend: API, streamer and flow-runner services"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"  # tested on 3.12 only (image + CI); widen once a 3.13 CI leg exists
dependencies = [
    # Settings
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # Security
    "PyJWT==2.14.0",           # replaces python-jose (unfixed CVEs, ecdsa dependency)
    "bcrypt==5.0.0",           # used directly (core/security/password.py); passlib is gone
    # Database
    "psycopg2-binary==2.9.13",   # wheels for py3.12; no libpq/compiler needed
    "SQLAlchemy==2.0.54",
    "alembic==1.20.0",
    # API
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "email_validator==2.3.0",
    "fastapi-pagination==0.16.0",
    # Streamer
    "confluent-kafka==2.15.1",
    "faststream[confluent,cli]==0.7.7",   # cli extra: the `faststream run` entrypoint
    # NOTE: pinned back from 0.7.5 (see Dependabot PR #8) - 0.7.x drops the `auto_commit` kwarg
    # from KafkaRegistrator.subscriber(), which interfaces/streamer/run_streamer.py relies on.
    # Upgrading needs a code change (deferred to the faststream migration follow-up), not a
    # version bump alone.
    # Flow runner
    "APScheduler==3.11.3",
    "prometheus-client==0.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "httpx>=0.27",   # fastapi TestClient
    "pytest-cov>=6",
]

[tool.uv]
# The code is not an installable package: modules are imported with PYTHONPATH=app.
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/migrations/versions"]

[tool.ruff.lint]
# Deliberate selection (pyflakes, pycodestyle, isort, bugbear, pyupgrade); CI runs it blocking.
# PLC0415: every import at module top; a function-level import is either a hidden cycle or a
# hidden optional dependency, and both belong in wiring, not inside a call.
select = ["E", "F", "I", "B", "UP", "PLC0415"]
ignore = ["B008"]  # FastAPI Depends()/Query() in defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
# The test bootstrap sets the environment before importing the app (settings read os.environ at
# import time), so its imports sit below that block by design.
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["adapters", "common", "config", "core", "infrastructure", "interfaces", "wiring", "tests"]

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
