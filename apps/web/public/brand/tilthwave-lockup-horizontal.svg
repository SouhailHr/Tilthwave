<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-label="Tilthwave horizontal lockup">
  <title>Tilthwave</title>
  <defs>
    <linearGradient id="lkLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A8E3A"/>
      <stop offset="100%" stop-color="#1F4A28"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(8,12)">
    <path d="M48 4
             C 76 10, 86 34, 80 58
             C 72 80, 50 86, 32 78
             C 16 72, 12 54, 18 38
             C 24 22, 36 10, 48 4 Z"
          fill="url(#lkLeaf)"/>
    <path d="M22 68
             C 28 58, 32 58, 38 50
             C 44 42, 48 42, 54 34
             C 60 26, 64 26, 70 20"
          stroke="#FAF6EC" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="58" r="2.6" fill="#1B2E1B"/>
    <circle cx="46" cy="44" r="2.6" fill="#1B2E1B"/>
    <circle cx="60" cy="30" r="2.6" fill="#1B2E1B"/>
  </g>

  <!-- Wordmark -->
  <text x="116" y="78"
        font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-size="56" font-weight="700"
        letter-spacing="-1.5"
        fill="#1B2E1B">tilthwave</text>
</svg>
