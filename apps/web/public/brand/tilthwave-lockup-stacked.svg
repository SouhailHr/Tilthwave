<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="360" height="280" role="img" aria-label="Tilthwave stacked lockup">
  <title>Tilthwave</title>
  <defs>
    <linearGradient id="stLeaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A8E3A"/>
      <stop offset="100%" stop-color="#1F4A28"/>
    </linearGradient>
  </defs>

  <g transform="translate(120,18)">
    <path d="M60 4
             C 92 12, 104 40, 96 70
             C 88 94, 60 100, 36 90
             C 18 82, 14 60, 22 40
             C 30 22, 44 10, 60 4 Z"
          fill="url(#stLeaf)"/>
    <path d="M30 82
             C 38 70, 42 70, 50 60
             C 58 50, 62 50, 70 40
             C 78 30, 82 30, 90 20"
          stroke="#FAF6EC" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <circle cx="42" cy="68" r="3" fill="#1B2E1B"/>
    <circle cx="60" cy="50" r="3" fill="#1B2E1B"/>
    <circle cx="78" cy="32" r="3" fill="#1B2E1B"/>
  </g>

  <text x="180" y="180" text-anchor="middle"
        font-family="Inter, 'Helvetica Neue', Arial, system-ui, sans-serif"
        font-size="64" font-weight="700"
        letter-spacing="-2"
        fill="#1B2E1B">tilthwave</text>
  <text x="180" y="220" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="18" font-style="italic" fill="#4A8E3A">
    Where farms speak. Fields listen.
  </text>
  <line x1="140" y1="240" x2="220" y2="240" stroke="#76D67E" stroke-width="2"/>
</svg>
