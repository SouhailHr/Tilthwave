<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tilthwave field background">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF6EC"/>
      <stop offset="100%" stop-color="#EFE8D6"/>
    </linearGradient>
    <linearGradient id="fcontour" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A8E3A" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4A8E3A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4A8E3A" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#fbg)"/>
  <g fill="none" stroke="url(#fcontour)" stroke-width="1.2">
    <path d="M-50 200 Q 300 160 600 200 T 1200 190 T 1700 210" opacity="0.55"/>
    <path d="M-50 280 Q 400 240 700 280 T 1300 270 T 1700 290" opacity="0.5"/>
    <path d="M-50 360 Q 250 320 550 360 T 1100 350 T 1700 370" opacity="0.45"/>
    <path d="M-50 460 Q 350 420 700 460 T 1300 450 T 1700 470" opacity="0.4"/>
    <path d="M-50 560 Q 450 520 800 560 T 1400 555 T 1700 570" opacity="0.35"/>
    <path d="M-50 660 Q 300 620 600 660 T 1200 650 T 1700 670" opacity="0.3"/>
    <path d="M-50 760 Q 400 720 750 760 T 1400 750 T 1700 770" opacity="0.25"/>
  </g>
  <!-- Sensor stations -->
  <g fill="#1F4A28">
    <circle cx="280" cy="280" r="4"/><circle cx="280" cy="280" r="10" fill="none" stroke="#1F4A28" stroke-width="1" opacity="0.4"/>
    <circle cx="640" cy="460" r="4"/><circle cx="640" cy="460" r="10" fill="none" stroke="#1F4A28" stroke-width="1" opacity="0.4"/>
    <circle cx="980" cy="350" r="4"/><circle cx="980" cy="350" r="10" fill="none" stroke="#1F4A28" stroke-width="1" opacity="0.4"/>
    <circle cx="1280" cy="560" r="4"/><circle cx="1280" cy="560" r="10" fill="none" stroke="#1F4A28" stroke-width="1" opacity="0.4"/>
    <circle cx="440" cy="660" r="4"/><circle cx="440" cy="660" r="10" fill="none" stroke="#1F4A28" stroke-width="1" opacity="0.4"/>
  </g>
</svg>
