services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* values are inlined into the client bundle at build time.
        # The browser resolves this URL, so it must be reachable from the host.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    image: fwc-front:latest
    container_name: fwc-front
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped