# Tilthwave — the whole stack in one compose file, shaped for production.
#
# This file names published images and publishes no host ports: it is what a production host
# (Coolify, or plain docker with `make deploy`) runs. Local development layers
# docker-compose.local.yml on top, which adds `build:` for the three app images and the
# 127.0.0.1 host ports; `make up` does that for you:
#
#   make env                              # once: creates deploy/.env with generated secrets
#   make up                               # build from this checkout and start everything
#
# Services (start order is enforced with depends_on conditions):
#   db            Postgres
#   db-backup     pg_dump to the pgbackups volume every BACKUP_INTERVAL_HOURS, kept BACKUP_KEEP_DAYS
#   redpanda      Kafka-compatible broker (+ console)
#   broker-init   one-shot: creates the two topics
#   migrate       one-shot: alembic upgrade head — everything below waits for it
#   api           FastAPI                                        -> http://localhost:8080/docs
#   seed          one-shot: demo farm, zones, sensors, admin user (idempotent)
#   streamer      backend: sensors topic -> sensor_records
#   flow-runner   backend: evaluates zone triggers, drives irrigation (only service that commands the field)
#   sim-actuators simulator: answers water-control commands on the broker
#   sim-sensors   simulator: publishes fake sensor readings (logs in to the API as the seeded worker)
#   web           Next.js dashboard                              -> http://localhost:3000
#   alloy         (profile: observability) Grafana Alloy: metrics + logs to Grafana Cloud
#
# Images: ghcr.io/souhailhr/tilthwave-*:${TILTHWAVE_TAG}. `local` is what docker-compose.local.yml
# builds; a release tag (v1.2.3) names the images .github/workflows/release.yml published.
# Optional profile `observability`: Grafana Alloy shipping metrics and logs to Grafana Cloud.
# Production reaches web and api through the platform's TLS proxy (Coolify's Traefik) on the
# container ports 3000 and 8080; nothing else is exposed. See README.md in this directory.
name: tilthwave

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-broker-env: &broker-env
  STREAMER_BROKER_HOSTS: '["redpanda:29092"]'
  STREAMER_SENSORS_TOPIC: ${SENSORS_TOPIC:-tilthwave.sensors.dev}
  STREAMER_WATER_CONTROL_TOPIC: ${WATER_CONTROL_TOPIC:-tilthwave.water-control.dev}
  STREAMER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}  # docker-compose.local.yml switches to text for a terminal
  TZ: ${TZ:-Europe/Paris}

# Backend services get exactly the variables they need; the admin credentials are NOT among them.
# Images: `make up` builds them from this checkout under the :local tag. A release tag
# (TILTHWAVE_TAG=v1.2.3 in .env) names the images .github/workflows/release.yml published
# instead, and `make deploy` pulls them without building.
# Secrets are plain ${VAR}, never ${VAR:?message}: Coolify's compose parser takes the message of a
# `:?` guard as a default VALUE, so the sentence "run make env..." became the database password on
# the first production deploy. Left blank, each one fails loudly on its own: postgres refuses to
# start without a password, the API refuses a short API_SECRET_KEY, the seed exits without
# ADMIN_PASSWORD. `make env` fills them all for a local stack.
x-backend: &backend
  image: ghcr.io/souhailhr/tilthwave-backend:${TILTHWAVE_TAG:-local}
  environment: &backend-env
    <<: *broker-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-tilthwave}
    POSTGRES_USER: ${POSTGRES_USER:-postgres}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    API_SECRET_KEY: ${API_SECRET_KEY}
    API_SESSION_IDLE_MINUTES: ${API_SESSION_IDLE_MINUTES:-60}
    API_SESSION_MAX_HOURS: ${API_SESSION_MAX_HOURS:-12}
    API_CORS_ORIGINS: ${API_CORS_ORIGINS:-["http://localhost:3000"]}
    API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-[]}
    API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}  # docker-compose.local.yml turns them on for development
    API_COOKIE_SECURE: ${API_COOKIE_SECURE:-false}
    API_COOKIE_DOMAIN: ${API_COOKIE_DOMAIN:-}
    API_WEB_BASE_URL: ${API_WEB_BASE_URL:-http://localhost:3000}
    API_METRICS_TOKEN: ${API_METRICS_TOKEN:-}  # unset: GET /metrics is a 404
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-tilthwave@localhost}
    SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    FLOW_RUNNER_MINUTES: ${FLOW_RUNNER_MINUTES:-0.2}
    FLOW_RUNNER_MAX_IRRIGATION_MINUTES: ${FLOW_RUNNER_MAX_IRRIGATION_MINUTES:-60}
    FLOW_RUNNER_MAX_READING_AGE_MINUTES: ${FLOW_RUNNER_MAX_READING_AGE_MINUTES:-30}
  logging: *default-logging

x-simulator: &simulator
  image: ghcr.io/souhailhr/tilthwave-simulator:${TILTHWAVE_TAG:-local}
  environment: &simulator-env
    <<: *broker-env
  logging: *default-logging

services:
  # ---------------------------------------------------------------- data ----
  db:
    image: postgres:16-alpine
    container_name: tilthwave-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tilthwave}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tilthwave}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    logging: *default-logging

  # A pg_dump every BACKUP_INTERVAL_HOURS into the pgbackups volume, pruned after BACKUP_KEEP_DAYS.
  # Restore: gunzip -c <file> | docker compose exec -T db psql -U postgres tilthwave
  db-backup:
    image: postgres:16-alpine
    container_name: tilthwave-db-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-tilthwave}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgbackups:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      # A dump counts as a backup only once gunzip can read it back; then LAST_OK is touched and
      # the healthcheck below reads its age. A dump that fails or does not verify leaves LAST_OK
      # alone, so a silent failure turns the service unhealthy within one interval plus an hour.
      - |
        while true; do
          f="/backups/tilthwave-$$(date +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --no-owner | gzip > "$$f.tmp" && gunzip -t "$$f.tmp" && mv "$$f.tmp" "$$f"; then
            touch /backups/LAST_OK
            echo "backup written and verified: $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "backup FAILED"; rm -f "$$f.tmp"
          fi
          find /backups -name 'tilthwave-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep "$$((BACKUP_INTERVAL_HOURS * 3600))"
        done
    healthcheck:
      test: ["CMD-SHELL", "find /backups/LAST_OK -mmin -$$((BACKUP_INTERVAL_HOURS * 60 + 60)) | grep -q ."]
      interval: 10m
      timeout: 5s
      retries: 1
      start_period: 5m
    restart: unless-stopped
    logging: *default-logging

  # -------------------------------------------------------------- broker ----
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.14
    container_name: tilthwave-redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:${KAFKA_PORT:-9092}
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - redpanda:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: 1536m
    restart: unless-stopped
    logging: *default-logging

  broker-init:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.14
    container_name: tilthwave-broker-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for t in "${SENSORS_TOPIC:-tilthwave.sensors.dev}" "${WATER_CONTROL_TOPIC:-tilthwave.water-control.dev}"; do
          # idempotent: TOPIC_ALREADY_EXISTS is the expected answer after the first run
          rpk topic create "$$t" -p 1 -X brokers=redpanda:29092 || true
        done
        rpk topic list -X brokers=redpanda:29092
    restart: "no"
    logging: *default-logging

  console:
    image: docker.redpanda.com/redpandadata/console:v3.7.2
    container_name: tilthwave-redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "echo \"$$CONSOLE_CONFIG_FILE\" > /tmp/config.yml; /app/console"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:29092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    restart: unless-stopped
    logging: *default-logging

  # ------------------------------------------------------------- backend ----
  migrate:
    <<: *backend
    container_name: tilthwave-migrate
    entrypoint: /backend/docker/migrate/entrypoint.sh
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: tilthwave-api
    entrypoint: /backend/docker/api/entrypoint.sh
    environment:
      <<: *backend-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    stop_grace_period: 30s
    restart: unless-stopped

  seed:
    <<: *backend
    container_name: tilthwave-seed
    entrypoint: ["python", "/backend/app/infrastructure/scripts/seed_data.py"]
    environment:
      <<: *backend-env
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SIM_USERNAME: ${SIM_USERNAME:-simulator}
      SIM_PASSWORD: ${SIM_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  streamer:
    <<: *backend
    container_name: tilthwave-streamer
    entrypoint: /backend/docker/streamer/entrypoint.sh
    environment:
      <<: *backend-env
      STREAMER_WORKERS: ${STREAMER_WORKERS:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully
    # /health pings the broker from inside the consumer process (run_streamer.py); a consumer
    # that lost its broker connection, or a process that stopped serving, fails it.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  flow-runner:
    <<: *backend
    container_name: tilthwave-flow-runner
    entrypoint: /backend/docker/flow_runner/entrypoint.sh
    depends_on:
      migrate:
        condition: service_completed_successfully
      broker-init:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    # The loop touches this file after every successful tick (FLOW_RUNNER_MINUTES apart); the
    # window must stay above that interval or the container is permanently unhealthy.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/flow-runner.heartbeat -mmin -${FLOW_RUNNER_HEARTBEAT_MAX_MINUTES:-2} | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 256m
    stop_grace_period: 30s
    restart: unless-stopped

  # ----------------------------------------------------------- simulator ----
  sim-actuators:
    <<: *simulator
    container_name: tilthwave-sim-actuators
    entrypoint: docker/actuators/entrypoint.sh
    environment:
      <<: *simulator-env
      STREAMER_WORKERS: ${STREAMER_WORKERS:-1}
    depends_on:
      broker-init:
        condition: service_completed_successfully
    mem_limit: 256m
    restart: unless-stopped

  sim-sensors:
    <<: *simulator
    container_name: tilthwave-sim-sensors
    entrypoint: docker/sensors/entrypoint.sh
    environment:
      <<: *simulator-env
      API_BASE_URL: http://api:8080
      # Read-only worker account seeded by the seed job: the simulator never holds admin credentials.
      API_USERNAME: ${SIM_USERNAME:-simulator}
      API_PASSWORD: ${SIM_PASSWORD}
      SENSORS_ROUNDS: ${SENSORS_ROUNDS:-0}
      SENSORS_INTERVAL_SECONDS: ${SENSORS_INTERVAL_SECONDS:-15}
      SENSORS_CYCLE_ROUNDS: ${SENSORS_CYCLE_ROUNDS:-10}
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      streamer:
        condition: service_started
    mem_limit: 256m
    restart: on-failure

  # ----------------------------------------------------------------- web ----
  web:
    image: ghcr.io/souhailhr/tilthwave-web:${TILTHWAVE_TAG:-local}
    container_name: tilthwave-web
    environment:
      # Server-side only (no NEXT_PUBLIC_ prefix, never reaches the browser bundle): lets
      # /api/health check the real backend over the docker network, not the host-facing URL.
      API_INTERNAL_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    logging: *default-logging

  # Observability (opt-in: COMPOSE_PROFILES=observability, or --profile observability). One agent:
  # scrapes the three /metrics endpoints on this network and ships the containers' logs, both to
  # Grafana Cloud (the alloy_config block at the end of this file, deploy/README.md). It reads the docker socket to
  # discover containers and read their logs; that socket is root on the host, which is why the
  # service is opt-in and the mount is read-only.
  alloy:
    image: grafana/alloy:v1.19.2
    container_name: tilthwave-alloy
    profiles: [observability]
    user: "0:0"  # the socket is root-owned on the host
    # Alloy itself starts happily with blank push URLs and just fails every push, so the wrapper
    # refuses first: a forgotten value is a container in a restart loop, not a silent one.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for v in API_METRICS_TOKEN GRAFANA_CLOUD_PROM_URL GRAFANA_CLOUD_PROM_USER GRAFANA_CLOUD_LOKI_URL GRAFANA_CLOUD_LOKI_USER GRAFANA_CLOUD_TOKEN; do
          env | grep -q "^$$v=." || { echo "alloy: $$v is not set (deploy/.env.example, Grafana Cloud)"; exit 1; }
        done
        # The Loki push endpoint is the stack's logs URL plus /loki/api/v1/push; the grafana.com page
        # shows the bare host, and a bare host answers 405 to every batch. Append it when missing.
        case "$$GRAFANA_CLOUD_LOKI_URL" in */loki/api/v1/push) ;; *) export GRAFANA_CLOUD_LOKI_URL="$${GRAFANA_CLOUD_LOKI_URL%/}/loki/api/v1/push" ;; esac
        exec alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    environment:
      SITE_NAME: ${SITE_NAME:-tilthwave}
      # The compose project whose containers' logs to ship: Coolify names the project after the
      # resource uuid (COOLIFY_RESOURCE_UUID in its deploy environment); `make up` uses "tilthwave".
      COMPOSE_PROJECT: ${COOLIFY_RESOURCE_UUID:-${COMPOSE_PROJECT_NAME:-tilthwave}}
      # Defaults are blank rather than required: compose evaluates `:?` even for a profile that is
      # not active, which would break `make up` for everyone; the entrypoint above checks instead.
      API_METRICS_TOKEN: ${API_METRICS_TOKEN:-}
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN:-}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # The config is a compose `configs` entry (below), not a bind mount: Coolify rewrites relative
    # bind paths to its own data directory and creates them as empty directories, which docker
    # then cannot mount onto a file. Inline content is materialised by docker itself.
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # The image ships neither curl nor wget; bash's /dev/tcp asks Alloy's readiness endpoint.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped
    logging: *default-logging

configs:
  alloy_config:
    content: |
      // Grafana Alloy: the one agent on the host. Scrapes the three /metrics endpoints on the compose
      // network and tails the containers' logs through the docker socket, and pushes both to Grafana
      // Cloud. Nothing here is reachable from outside: the API's /metrics is scraped on the network
      // with API_METRICS_TOKEN, and Alloy's own UI (:12345) is not published.
      //
      // Every value that names the account comes from the environment (deploy/.env): the stack's
      // Prometheus and Loki push URLs and user ids, one access-policy token with metrics:write and
      // logs:write, and SITE_NAME to tell farms apart in one Grafana.

      // ---- metrics --------------------------------------------------------------------------------------

      prometheus.scrape "backend" {
        targets = [
          { __address__ = "streamer:8081", job = "streamer" },
          { __address__ = "flow-runner:8082", job = "flow-runner" },
        ]
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
      }

      prometheus.scrape "api" {
        targets         = [{ __address__ = "api:8080", job = "api" }]
        bearer_token    = sys.env("API_METRICS_TOKEN")
        scrape_interval = "30s"
        forward_to      = [prometheus.remote_write.grafana_cloud.receiver]
      }

      prometheus.remote_write "grafana_cloud" {
        external_labels = { site = sys.env("SITE_NAME") }

        endpoint {
          url = sys.env("GRAFANA_CLOUD_PROM_URL")

          basic_auth {
            username = sys.env("GRAFANA_CLOUD_PROM_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }

      // ---- logs -----------------------------------------------------------------------------------------

      // Only this stack's containers. The compose project name is "tilthwave" locally and the
      // resource uuid on Coolify, so it comes in through COMPOSE_PROJECT (set on the service).
      discovery.docker "compose" {
        host = "unix:///var/run/docker.sock"

        filter {
          name   = "label"
          values = ["com.docker.compose.project=" + sys.env("COMPOSE_PROJECT")]
        }
      }

      discovery.relabel "compose" {
        targets = discovery.docker.compose.targets

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
      }

      loki.source.docker "compose" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.compose.output
        labels     = { site = sys.env("SITE_NAME") }
        forward_to = [loki.process.backend_json.receiver]
      }

      // The backend writes one JSON object per line (LOG_FORMAT=json): level becomes a label (a
      // handful of values), logger and request_id become structured metadata (unbounded, queryable,
      // not indexed). Lines that are not JSON (web, redpanda, postgres) pass through untouched.
      loki.process "backend_json" {
        forward_to = [loki.write.grafana_cloud.receiver]

        stage.json {
          expressions = { level = "level", logger = "logger", request_id = "request_id" }
        }

        stage.labels {
          values = { level = "" }
        }

        stage.structured_metadata {
          values = { logger = "", request_id = "" }
        }
      }

      loki.write "grafana_cloud" {
        endpoint {
          url = sys.env("GRAFANA_CLOUD_LOKI_URL")

          basic_auth {
            username = sys.env("GRAFANA_CLOUD_LOKI_USER")
            password = sys.env("GRAFANA_CLOUD_TOKEN")
          }
        }
      }

volumes:
  alloy-data:
  pgdata:
  pgbackups:
  redpanda:
